<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R6 Operator Picker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rainbow Six Siege Operator Picker (Ranked)</h1>

  <div class="selectors">
    <label for="mapSelect">Select Map:</label>
    <select id="mapSelect"></select>

    <label for="sideSelect">Select Side:</label>
    <select id="sideSelect">
      <option value="attacker">Attacker</option>
      <option value="defender">Defender</option>
    </select>
  </div>

  <div id="operatorsContainer"></div>

  <h2>Top 3 Recommendations</h2>
  <div id="recommendations"></div>

  <script src="script.js"></script>
</body>
</html>
